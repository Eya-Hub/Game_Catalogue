<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Game Arena</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <header>
        <h1>Game Arena - Admin Panel</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#add-game">Ajouter un Jeu</a></li>
            <li><a href="#manage-users">Gérer les Utilisateurs</a></li>
            <li><a href="#manage-comments">Gérer les Commentaires</a></li>
        </ul>
    </nav>
    <main>
        <!-- Ajouter un Jeu -->
        <section id="add-game">
            <h2>Ajouter un Nouveau Jeu</h2>
            <form action="add_game.php" method="POST">
                <label for="game-name">Nom du Jeu :</label>
                <input type="text" id="game-name" name="game_name" required>

                <label for="platform">Plateforme :</label>
                <input type="text" id="platform" name="platform" required>

                <label for="release-date">Date de Sortie :</label>
                <input type="date" id="release-date" name="release_date" required>

                <label for="description">Description :</label>
                <textarea id="description" name="description" rows="4" required></textarea>

                <label for="poster">Poster du Jeu :</label>
                <input type="file" id="poster" name="poster" accept="image/*" required>
            

                <button type="submit">Ajouter le Jeu</button>
            </form>
        </section>

        <!-- Gérer les Utilisateurs -->
        <section id="manage-users">
            <h2>Supprimer un Compte Utilisateur</h2>
            <form action="delete_user.php" method="POST">
                <label for="user-id">ID de l'Utilisateur :</label>
                <input type="number" id="user-id" name="user_id" required>
                <button type="submit">Supprimer</button>
            </form>
        </section>

        <!-- Gérer les Commentaires -->
        <section id="manage-comments">
            <h2>Supprimer un Commentaire</h2>
            <form action="delete_comment.php" method="POST">
                <label for="comment-id">ID du Commentaire :</label>
                <input type="number" id="comment-id" name="comment_id" required>
                <button type="submit">Supprimer</button>
            </form>
        </section>
    </main>
</body>
</html>
